name: Release

# On every push to main: while there are changesets, opens (or updates) the "Version packages" pull
# request with the new versions and changelogs; merging it publishes the packages to npm.
# Publishing uses npm trusted publishing (OIDC): no token is stored anywhere. No registry-url on
# setup-node: it would write an .npmrc with a placeholder token that npm tries instead of OIDC.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
